[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperv-acu"
version = "0.1.0"
description = "Hyper-V VM desktop MCP server and guest isolation guards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "mcp>=1.0",
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
hyperv-acu = "hyperv_acu.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
